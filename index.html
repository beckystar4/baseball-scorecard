<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scorecard</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="./src/index.js"></script>
</head>
<h1>⚾ Baseball Scorebook ⚾</h1>
<div class="team-tabs">
    <button class="team-tab active" data-team="home">
        HOME TEAM
    </button>

    <button class="team-tab" data-team="away">
        AWAY TEAM
    </button>
</div>

<div class="scorebook-actions">
    <button id="saveGame">
        Save Scorebook
    </button>

    <button id="loadGame">
        Load Scorebook
    </button>
    <input type="file" id="gameFile" accept=".json,application/json" hidden>
</div>

<!-- HOME SCORECARD -->
<section class="scorecard active" data-team="home">

    <div class="team-info">
        <label>Team</label>
        <input
            type="text"
            class="team-name"
            spellcheck="false"
            autocomplete="off"
            autocorrect="off"
            autocapitalize="off"
            placeholder="TEAM NAME"
        >
    </div>

    <table class="positions">
        <thead>
            <tr>
                <th>PO</th>
                <th>Player</th>
                <th>1</th>
                <th>2</th>
                <th>3</th>
                <th>4</th>
                <th>5</th>
                <th>6</th>
                <th>7</th>
                <th>8</th>
                <th>9</th>
                <th>10</th>
                <th>11</th>
                <th>12</th>
            </tr>
        </thead>

        <tbody class="playerRows">
            <tr class="playerRow" draggable="true">
                <td class="player-po">
                    <span class="drag-handle">☰</span>DH
                </td>

                <td>
                    <input
                        type="text"
                        class="player-name"
                        spellcheck="false"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        placeholder="PLAYER NAME"
                    >
                </td>
            </tr>
        </tbody>
    </table>

    <table class="inningTotals">
        <tr>
            <th>1</th>
            <th>2</th>
            <th>3</th>
            <th>4</th>
            <th>5</th>
            <th>6</th>
            <th>7</th>
            <th>8</th>
            <th>9</th>
            <th>10</th>
            <th>11</th>
            <th>12</th>
            <th>Total</th>
        </tr>

        <tr class="scoresRow"></tr>

        <tr class="totalRuns">
            <td colspan="12"></td>
            <td class="totalRunsValue">0</td>
        </tr>
    </table>

</section>


<!-- AWAY SCORECARD -->

                <th>4</th>
                <th>5</th>
                <th>6</th>
                <th>7</th>
                <th>8</th>
                <th>9</th>
                <th>10</th>
                <th>11</th>
                <th>12</th>
            </tr>
        </thead>

        <tbody class="playerRows">
            <tr class="playerRow" draggable="true">
                <td class="player-po">
                    <span class="drag-handle">☰</span>DH
                </td>

                <td>
                    <input
                        type="text"
                        class="player-name"
                        spellcheck="false"
                        autocomplete="off"
                        autocorrect="off"
                        autocapitalize="off"
                        placeholder="PLAYER NAME"
                    >
                </td>
            </tr>
        </tbody>
    </table>

    <table class="inningTotals">
        <tr>
            <th>1</th>
            <th>2</th>
            <th>3</th>
            <th>4</th>
            <th>5</th>
            <th>6</th>
            <th>7</th>
            <th>8</th>
            <th>9</th>
            <th>10</th>
            <th>11</th>
            <th>12</th>
            <th>Total</th>
        </tr>

        <tr class="scoresRow"></tr>

        <tr class="totalRuns">
            <td colspan="12"></td>
            <td class="totalRunsValue">0</td>
        </tr>
    </table>

</section>
</html>
